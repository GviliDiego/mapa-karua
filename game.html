:root{--bg:#100C20;--panel:#1A1536;--line:#3D3478;--deep:#080614;--muted:#A9A3C9;--fg:#F4EFE0;--yellow:#CDA832;--mint:#5EE0C0;--pink:#FF7AA2;--err:#FFB3A7;
--alenbi:'Alenbi Sans','Heebo',system-ui,sans-serif;--pixel:'Rubik Pixels','Heebo',sans-serif;--ui:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--deep);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5;overflow:hidden;margin:0}
*{box-sizing:border-box}
#app{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);width:min(100%,440px);margin-inline:auto;position:relative;background:var(--bg);border-inline:2px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:10px 16px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding-block:4px 8px;padding-inline:3px}
h1,h2,h3{font-family:var(--alenbi);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:46px;color:var(--yellow);line-height:1.1}
h2{font-size:28px}
h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.lead{font-family:var(--alenbi);font-size:18px;line-height:1.25;color:var(--muted)}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto;background:var(--deep)}
.btn{font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--deep);padding:8px 14px;min-height:48px;text-align:start;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:flex-start;gap:12px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--deep)}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.btn .mk{flex:none;width:8px;height:8px;background:var(--muted)}
.btn.center{justify-content:center;text-align:center}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--bg);font-weight:700;font-size:21px;min-height:56px;gap:12px}
.btn.mid{background:var(--line);color:var(--fg);font-weight:700}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--muted);font-weight:500}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);font-weight:500;width:auto;min-height:44px;padding:0 12px;font-size:14px}
.chip{font:inherit;font-size:14px;background:transparent;border:2px solid transparent;color:var(--muted);padding:0 12px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;font-size:20px;background:var(--deep);color:var(--fg);border:2px solid var(--line);padding:10px 14px;border-radius:0;width:100%}
.err{color:var(--err);font-size:14px;min-height:20px}
.ok{color:var(--yellow)}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--deep);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:4px;min-height:48px;justify-content:space-between;position:relative}
.top .label{flex:1;text-align:center;font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;background:transparent;color:var(--muted);border:2px solid transparent;cursor:pointer;padding:0;flex:none}
.ib[aria-expanded=true]{background:var(--line);color:var(--fg);border-color:var(--yellow)}
.ico{display:block;flex:none}
.badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:16px;height:16px;padding:0 3px;background:var(--yellow);color:var(--bg);font-size:11px;font-weight:700;line-height:16px;text-align:center}
.tip{position:absolute;top:calc(100% + 4px);left:0;z-index:5;width:240px;padding:12px 14px;background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--deep);display:flex;flex-direction:column;gap:8px}
.tip:before{content:"";position:absolute;top:-10px;left:60px;border:8px solid transparent;border-top:0;border-bottom:8px solid var(--line)}
.tip:after{content:"";position:absolute;top:-6px;left:62px;border:6px solid transparent;border-top:0;border-bottom:6px solid var(--panel)}
.tip .it{font-size:14px;display:flex;gap:8px}
.tip .it:before{content:"";flex:none;width:8px;height:8px;margin-top:7px;background:var(--yellow)}
.tip .hd{display:flex;justify-content:space-between;align-items:baseline}
.tip .hd b{font-family:var(--alenbi);font-size:18px}
.imgwrap{position:relative;border:2px solid var(--line);align-self:center;width:100%}
.imgwrap.tall{width:300px;max-width:84%}
.imgwrap:not(.tall){width:calc(100% + 38px);margin-inline:-19px;border-inline-width:0}
.stats{position:absolute;inset-block-end:8px;inset-inline-start:8px;display:flex;gap:12px;background:rgba(8,6,20,.84);padding:4px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.stats span{display:flex;align-items:center;gap:5px}
.opens{font-family:var(--alenbi);font-size:17px;line-height:1.25;color:var(--muted);text-align:center;text-wrap:balance}
.story{font-family:var(--alenbi);font-size:21px;line-height:1.25;text-wrap:balance;text-align:center}
.kw{font-family:var(--alenbi);font-weight:700;color:var(--yellow)}
.choices{display:flex;flex-direction:column;gap:10px;padding-block:6px 4px}
.fade{animation:fd .4s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.blink{animation:none!important}}
#s-open{align-items:center;text-align:center;gap:14px;padding-top:24px}
#s-open .frame{border:2px solid var(--line);height:min(54vh,480px);aspect-ratio:3/4;max-width:100%;flex:none}
#s-open .frame img{width:100%;height:100%}
#s-open .sub{font-family:var(--alenbi);font-size:18px;color:var(--muted)}
#s-open .mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.lockwrap{display:flex;justify-content:center}
.lockwrap{align-items:flex-end;gap:10px}
.deco{flex:none;width:34px;height:auto;opacity:.9;align-self:flex-end;margin-bottom:2px}
@media (max-width:330px){.deco{display:none}}

svg.lock{flex:0 1 240px;min-width:0;width:240px;max-width:100%;aspect-ratio:1;touch-action:none;user-select:none;background:var(--deep);border:2px solid var(--line)}
.lock .dot{fill:var(--panel);stroke:var(--line);stroke-width:2}
.lock .dot.on{fill:var(--yellow);stroke:var(--fg)}
.lock polyline{fill:none;stroke:var(--yellow);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.lock text{fill:var(--muted);font-size:13px;font-family:var(--ui);pointer-events:none}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px}
.row .grow{flex:1}
.stat{display:flex;gap:16px;font-size:14px}
.stat span{display:flex;align-items:center;gap:6px}
.tabs{display:flex}
.tab{flex:1;font:inherit;font-weight:700;background:var(--panel);color:var(--muted);border:2px solid var(--line);padding:10px;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--line);color:var(--fg);border-color:var(--yellow)}
.map{position:relative;display:flex;flex-direction:column;padding-inline-start:30px}
.map:before{content:"";position:absolute;inset-block:14px;inset-inline-start:11px;width:2px;background:var(--line)}
.node{position:relative;padding:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.node:before{content:"";position:absolute;inset-inline-start:-26px;top:14px;width:10px;height:10px;background:var(--muted)}
.node.now:before{background:var(--yellow);box-shadow:0 0 0 3px var(--line)}
.node .k{font-family:var(--alenbi);font-weight:700;font-size:18px}
.node .c{font-size:15px}
.node .go{align-self:flex-start;width:auto}
.fullstory p{font-family:var(--alenbi);margin-bottom:12px;font-size:18px;line-height:1.3}
.fullstory .pick{font-family:var(--ui);color:var(--yellow);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.end{display:flex;flex-direction:column;gap:6px;font-size:13px;text-align:center;color:var(--muted)}
.end .t{aspect-ratio:3/4;background:var(--deep);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:28px;color:var(--line);overflow:hidden}
.end.found{color:var(--fg)}
.end.found .t{border-color:var(--yellow)}
.end .t img{width:100%;height:100%;object-fit:cover}
.note{font-size:13px;color:var(--muted);background:var(--deep);padding:10px 12px;border:2px solid var(--line)}
.blink{color:var(--yellow);animation:bl 1.6s steps(2,jump-none) infinite}
@keyframes bl{50%{opacity:.3}}
.say{background:var(--panel);border:2px solid var(--line);border-inline-start:6px solid var(--yellow);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.say p{font-family:var(--alenbi);font-size:18px;line-height:1.3}
.say b{color:var(--yellow)}
.stg{display:flex;align-items:center;gap:6px;font-size:14px}
.stg b{margin-inline-start:6px}
.sq{width:14px;height:14px;border:2px solid var(--line);background:var(--deep)}
.sq.on{background:var(--yellow);border-color:var(--yellow)}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.btn.txt{background:transparent;border-color:transparent;box-shadow:none;color:var(--yellow);font-weight:700;font-size:18px;text-decoration:underline;text-underline-offset:4px;min-height:52px}
.btn.txt:active{transform:none}
#s-entry{align-items:center;justify-content:center;text-align:center;gap:18px}
#s-entry h2{font-size:32px;color:var(--yellow)}
.lead2{font-family:var(--alenbi);font-size:22px;line-height:1.3;color:var(--fg);max-width:20em}
#s-entry .acts{width:100%;margin-top:34px}
.field+.lead,.field+.say{margin-top:18px}
.err .chip{padding:0;min-height:0;display:inline;border:0;font:inherit;color:var(--yellow);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
[hidden]{display:none!important}
</style>

function full(){
 const me=users()[S.user];
 show(`<section class="screen"><div class="top"><span></span>${backBtn()}</div><div class="scroll fade"><h2>יש כבר 5 שמירות</h2><p class="lead">כדי להתחיל משחק חדש צריך לפנות מקום. בחרו שמירה למחוק.</p><div id="list" style="display:flex;flex-direction:column;gap:10px"></div><p class="muted small">השמירה שתבחרו תימחק לתמיד.</p></div></section>`,()=>{
  $('#back').onclick=menu;
  me.saves.slice().sort((a,b)=>a.upd-b.upd).forEach(sv=>{const st=replay(sv.hist);const b=document.createElement('button');b.className='btn';b.style.minHeight='56px';b.innerHTML=`<span class="mk"></span><span style="flex:1">${fmt(sv.upd)}</span><span class="muted small">${st.ending?'הסתיים':'שלב '+Math.max(st.step,1)+' מתוך '+TOTAL}</span>`;b.onclick=()=>{mutate(m=>{m.saves=m.saves.filter(x=>x.id!==sv.id)});newGame()};$('#list').appendChild(b)});
 });
}
function newGame(){const id='s'+Date.now();mutate(m=>{m.saves.push({id,hist:[],upd:Date.now()})});S.save=id;play()}
function header(st,label){
 return `<div class="top"><button class="ib" id="menu" aria-label="תפריט">${ico('menu')}</button><span class="label">${label}</span>
 <button class="ib" id="bag" aria-label="התרמיל, ${st.items.length} חפצים" aria-expanded="false">${ico('bag')}<span class="badge">${st.items.length}</span></button>
 <button class="ib" id="map" aria-label="מפת המסע">${ico('map')}</button>
 <div class="tip" id="bagp" role="dialog" aria-label="התרמיל" hidden><div class="hd"><b>התרמיל</b><span class="muted small">${st.items.length} חפצים</span></div>${st.items.map(i=>`<span class="it">${esc(i)}</span>`).join('')}</div></div>`;
}
function wireHeader(){
 $('#menu').onclick=menu;$('#map').onclick=()=>journey('map');
 $('#bag').onclick=()=>{const p=$('#bagp'),o=p.hidden;p.hidden=!o;$('#bag').setAttribute('aria-expanded',o)};
}
function play(){
 const sv=curSave();if(!sv)return menu();const st=replay(sv.hist);
 if(st.ending)return endCard(st.ending);
 if(st.step>=STEPS.length)return actEnd(st);
 const step=stepAt(st.step,sv.hist);
 const label=st.step===0?'פתיחה':'מערכה א׳ · שלב '+st.step+' מתוך '+TOTAL;
 show(`<section class="screen">${header(st,label)}
 <div class="scroll fade">
 <div class="imgwrap ${step.tall?'tall':''}">${img(step.img)}${st.step>0?`<div class="stats" role="group" aria-label="אומץ ${st.c}, תושייה ${st.w}, לב ${st.h}"><span>${ico('courage',16)}${st.c}</span><span>${ico('wit',16)}${st.w}</span><span>${ico('heart',16)}${st.h}</span></div>`:''}</div>
 ${st.opens?`<p class="opens">${esc(st.opens)}</p>`:''}
 <p class="story">${kwText(step)}</p>
 <div class="choices" role="group" aria-label="מה עושים?">${step.choices.map((c,i)=>`<button class="btn ${step.choices.length===1?'yellow center':''}" data-i="${i}">${step.choices.length===1?'':'<span class="mk"></span>'}<span style="flex:1">${esc(c.label)}</span></button>`).join('')}</div>
 ${st.step>0?`<div><button class="btn quiet" id="undo">${ico('back',16)}<span>צעד אחורה</span></button></div>`:''}</div></section>`,()=>{
  wireHeader();
  const u=$('#undo');if(u)u.onclick=undoLast;
  app.querySelectorAll('.choices .btn').forEach(b=>b.onclick=()=>{mutate(m=>{const s=m.saves.find(x=>x.id===S.save);s.hist.push(+b.dataset.i);s.upd=Date.now()});play()});
 });
}
function endCard(id){
 const e=ENDINGS.find(x=>x.id===id);
 mutate(m=>{if(!m.endings.includes(id))m.endings.push(id)});
 show(`<section class="screen"><div class="scroll fade"><div class="imgwrap tall">${img(e.img)}</div><div class="muted small" style="text-align:center">סוף</div><h2 style="text-align:center">${esc(e.name)}</h2><p class="story">${esc(e.text)}</p>
 <div class="muted small">${esc(e.hint||'')}</div>
 <button class="btn yellow center" id="retry">לנסות דרך אחרת</button>
 <button class="btn mid center" id="sum">סיכום המסע</button><button class="btn ghost center" id="col">אוסף הסופים</button><button class="btn ghost center" id="m">לתפריט</button></div></section>`,()=>{
  $('#retry').onclick=undoLast;$('#sum').onclick=()=>journey('map');$('#col').onclick=()=>endings('end');$('#m').onclick=menu;
 });
}
function actEnd(st){
 show(`<section class="screen"><div class="scroll fade"><div class="imgwrap tall">${img('t01_act2_marsh')}</div>
 <div class="muted small" style="text-align:center">סוף מערכה א׳</div>
 ${st.opens?`<p class="opens">${esc(st.opens)}</p>`:''}
 <p class="story">${st.zik?'זיק איתכם.':'זיק נשאר מאחור.'} הסוד של יובל עדיין פתוח, והדרך אל האור נמשכת. המערכה השנייה עוד בדרך.</p>
 ${statRow(st)}
 <button class="btn yellow center" id="sum">סיכום המסע</button><button class="btn mid center" id="undo">צעד אחורה</button><button class="btn ghost center" id="m">לתפריט</button></div></section>`,()=>{
  $('#sum').onclick=()=>journey('map');$('#m').onclick=menu;$('#undo').onclick=undoLast;
 });
}
function journey(tab){
 const sv=curSave();const st=replay(sv.hist);const h=sv.hist;
 const map=st.visited.map((v,idx)=>{const stp=stepAt(v.i,h),ch=stp.choices[v.ch];const last=idx===st.visited.length-1&&st.step<STEPS.length&&!st.ending;
  return `<div class="node ${last?'now':''}"><div class="k">${v.i===0?'פתיחה':'שלב '+v.i} · ${esc(stp.kw||stp.key)}</div><div class="c">${v.i===0?'התחלת המסע':'בחרתם: '+esc(ch.label)}</div>${v.i>0?`<button class="btn quiet go" data-i="${v.i}">חזרה לנקודה הזו</button>`:''}</div>`}).join('');
 const story=st.visited.map(v=>{const stp=stepAt(v.i,h),ch=stp.choices[v.ch];const prev=v.i>0?stepAt(v.i-1,h).choices[h[v.i-1]].opens:'';
  return `${prev?`<p>${esc(prev)}</p>`:''}<p>${esc(stp.text)}</p>${v.i>0?`<p class="pick">${esc(ch.label)}</p>`:''}`}).join('')+(st.opens?`<p>${esc(st.opens)}</p>`:'');
 show(`<section class="screen"><div class="top"><h2>סיכום המסע</h2>${backBtn()}</div>
 <div class="tabs" role="tablist"><button class="tab" role="tab" id="t1" aria-selected="${tab==='map'}">מפת ההחלטות</button><button class="tab" role="tab" id="t2" aria-selected="${tab!=='map'}">הסיפור שלי</button></div>
 <div class="scroll fade"><div id="p1" ${tab==='map'?'':'hidden'}><div class="map">${map}</div><p class="muted small" style="margin-top:8px">חזרה לנקודה מוחקת את כל מה שקרה אחריה.</p></div><div id="p2" class="fullstory" ${tab==='map'?'hidden':''}>${story}</div></div></section>`,()=>{
  $('#back').onclick=play;
  const sw=a=>{$('#t1').setAttribute('aria-selected',a);$('#t2').setAttribute('aria-selected',!a);$('#p1').hidden=!a;$('#p2').hidden=a};
  $('#t1').onclick=()=>sw(true);$('#t2').onclick=()=>sw(false);
  app.querySelectorAll('.go').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;mutate(m=>{const s=m.saves.find(x=>x.id===S.save);s.hist=s.hist.slice(0,i);s.upd=Date.now()});play()});
 });
}
function endings(from){
 const me=users()[S.user];
 show(`<section class="screen"><div class="top"><h2>אוסף הסופים</h2>${backBtn()}</div><p class="lead">מצאתם ${me.endings.length} מתוך ${ENDINGS.length}. לכל סוף יש דרך משלו.</p>
 <div class="scroll fade"><div class="grid">${ENDINGS.map(e=>{const f=me.endings.includes(e.id);return `<div class="end ${f?'found':''}"><div class="t">${f&&e.img?img(e.img):'?'}</div><span>${f?esc(e.name):'סוף נסתר'}</span></div>`}).join('')}</div></div></section>`,()=>{
  $('#back').onclick=()=>{from==='end'?play():menu()};
 });
}
openScreen();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
