:root{--bg:#100C20;--panel:#1A1536;--line:#3D3478;--deep:#080614;--muted:#A9A3C9;--fg:#F4EFE0;--yellow:#CDA832;--mint:#5EE0C0;--pink:#FF7AA2;--err:#FFB3A7;
--alenbi:'Rubik','Heebo',system-ui,sans-serif;--title:'Atlas','Rubik','Heebo',system-ui,sans-serif;--pixel:'Rubik Pixels','Heebo',sans-serif;--ui:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--deep);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5;overflow:hidden;margin:0}
*{box-sizing:border-box}
#app{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);width:min(100%,440px);margin-inline:auto;position:relative;background:var(--bg);border-inline:2px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:10px 16px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding-block:4px 8px;padding-inline:3px}
h1,h2,h3{font-family:var(--title);font-weight:900;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:46px;color:var(--yellow);line-height:1.1}
h2{font-size:28px}
h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.lead{font-family:var(--alenbi);font-size:18px;line-height:1.4;color:var(--muted)}
.ov{position:absolute;inset:0;width:100%!important;height:100%!important;background:none!important;pointer-events:none;animation:twinkle 6s ease-in-out infinite}
.ov.g2{animation-duration:8.5s;animation-delay:-3s}.ov.g3{animation-duration:11s;animation-delay:-7s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.ov{animation:none}}
#s-open .frame,.end .t{position:relative}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto;background:var(--deep)}
.btn{font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--deep);padding:8px 14px;min-height:48px;text-align:start;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:flex-start;gap:12px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--deep)}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.btn .mk{flex:none;width:8px;height:8px;background:var(--muted)}
.btn.center{justify-content:center;text-align:center}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--bg);font-weight:700;font-size:21px;min-height:56px;gap:12px}
.btn.mid{background:var(--line);color:var(--fg);font-weight:700}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--muted);font-weight:500}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);font-weight:500;width:auto;min-height:44px;padding:0 12px;font-size:14px}
.chip{font:inherit;font-size:14px;background:transparent;border:2px solid transparent;color:var(--muted);padding:0 12px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;font-size:20px;background:var(--deep);color:var(--fg);border:2px solid var(--line);padding:10px 14px;border-radius:0;width:100%}
.err{color:var(--err);font-size:14px;min-height:20px}
.ok{color:var(--yellow)}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--deep);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:4px;min-height:48px;justify-content:space-between;position:relative}
.top .label{flex:1;text-align:center;font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;background:transparent;color:var(--muted);border:2px solid transparent;cursor:pointer;padding:0;flex:none}
.ib[aria-expanded=true]{background:var(--line);color:var(--fg);border-color:var(--yellow)}
.ico{display:block;flex:none}
.badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:16px;height:16px;padding:0 3px;background:var(--yellow);color:var(--bg);font-size:11px;font-weight:700;line-height:16px;text-align:center}
.tip{position:absolute;top:calc(100% + 4px);left:0;z-index:5;width:240px;padding:12px 14px;background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--deep);display:flex;flex-direction:column;gap:8px}
.tip:before{content:"";position:absolute;top:-10px;left:60px;border:8px solid transparent;border-top:0;border-bottom:8px solid var(--line)}
.tip:after{content:"";position:absolute;top:-6px;left:62px;border:6px solid transparent;border-top:0;border-bottom:6px solid var(--panel)}
.tip .it{font-size:14px;display:flex;gap:8px}
.tip .it:before{content:"";flex:none;width:8px;height:8px;margin-top:7px;background:var(--yellow)}
.tip .hd{display:flex;justify-content:space-between;align-items:baseline}
.tip .hd b{font-family:var(--alenbi);font-size:18px}
.imgwrap{position:relative;border:2px solid var(--line);align-self:center;width:100%}
.imgwrap.tall{width:calc(100% + 38px);margin-inline:-19px;border-inline-width:0;height:min(46vh,430px);overflow:hidden}
.imgwrap.tall img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.imgwrap.tall.sm{height:min(34vh,320px)}
.imgwrap:not(.tall){width:calc(100% + 38px);margin-inline:-19px;border-inline-width:0}
.stats{position:absolute;inset-block-end:8px;inset-inline-start:8px;display:flex;gap:12px;background:rgba(8,6,20,.84);padding:4px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.stats span{display:flex;align-items:center;gap:5px}
.score{background:var(--panel);border:2px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.score h3{font-size:18px}
.srow{display:grid;grid-template-columns:22px auto 1fr;grid-template-areas:"i n c" "i d d";align-items:center;column-gap:10px;row-gap:0}
.srow .si{grid-area:i;display:flex;align-self:start;padding-top:3px}
.srow b{grid-area:n}
.srow .sn{grid-area:c;justify-self:end;font-variant-numeric:tabular-nums;font-weight:700}
.srow .sd{grid-area:d;color:var(--muted);font-size:14px}
.opens{font-family:var(--alenbi);font-size:21px;line-height:1.4;color:var(--fg);text-align:right;text-wrap:pretty;margin-bottom:-6px}
.story{font-family:var(--alenbi);font-size:21px;line-height:1.4;text-wrap:pretty;text-align:right}
.kw{font-family:var(--alenbi);font-weight:700;color:var(--yellow)}
.choices{display:flex;flex-direction:column;gap:10px;padding-block:6px 4px}
.fade{animation:fd .4s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.blink{animation:none!important}}
#s-open{align-items:center;text-align:center;gap:14px;padding-top:0}
#s-open .frame{border:2px solid var(--line);border-inline-width:0;height:min(52vh,470px);width:calc(100% + 38px);margin-inline:-19px;flex:none;overflow:hidden}
#s-open .frame img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
#s-open .sub{font-family:var(--alenbi);font-size:18px;color:var(--muted)}
#s-open .mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.lockwrap{display:flex;justify-content:center}
.lockwrap{align-items:flex-end;gap:10px}
.deco{flex:none;width:34px;height:auto;opacity:.9;align-self:flex-end;margin-bottom:2px}
@media (max-width:330px){.deco{display:none}}

svg.lock{flex:0 1 240px;min-width:0;width:240px;max-width:100%;aspect-ratio:1;touch-action:none;user-select:none;background:var(--deep);border:2px solid var(--line)}
.lock .dot{fill:var(--panel);stroke:var(--line);stroke-width:2}
.lock .dot.on{fill:var(--yellow);stroke:var(--fg)}
.lock polyline{fill:none;stroke:var(--yellow);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.lock text{fill:var(--muted);font-size:13px;font-family:var(--ui);pointer-events:none}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px}
.row .grow{flex:1}
.stat{display:flex;gap:16px;font-size:14px}
.stat span{display:flex;align-items:center;gap:6px}
.tabs{display:flex}
.tab{flex:1;font:inherit;font-weight:700;background:var(--panel);color:var(--muted);border:2px solid var(--line);padding:10px;cursor:pointer;min-height:44px;border-radius:0;position:relative}
.tab+.tab{margin-inline-start:-2px}
.tab:first-child{border-start-start-radius:10px;border-end-start-radius:10px}
.tab:last-child{border-start-end-radius:10px;border-end-end-radius:10px}
.tab[aria-selected=true]{background:var(--line);color:var(--fg);border-color:var(--yellow);z-index:1}
.map{position:relative;display:flex;flex-direction:column;padding-inline-start:30px}
.map:before{content:"";position:absolute;inset-block:14px;inset-inline-start:11px;width:2px;background:var(--line)}
.node{position:relative;padding:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.node:before{content:"";position:absolute;inset-inline-start:-26px;top:14px;width:10px;height:10px;background:var(--muted)}
.node.now:before{background:var(--yellow);box-shadow:0 0 0 3px var(--line)}
.node .k{font-family:var(--alenbi);font-weight:700;font-size:18px}
.node .c{font-size:15px}
.node .go{align-self:flex-start;width:auto}
.fullstory p{font-family:var(--alenbi);margin-bottom:12px;font-size:18px;line-height:1.4}
.fullstory .pick{font-family:var(--ui);color:var(--yellow);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.end{display:flex;flex-direction:column;gap:6px;font-size:13px;text-align:center;color:var(--muted)}
.end .t{aspect-ratio:3/4;background:var(--deep);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:28px;color:var(--line);overflow:hidden}
.end.found{color:var(--fg)}
.end.found .t{border-color:var(--yellow)}
.end .t img{width:100%;height:100%;object-fit:cover}
.note{font-size:13px;color:var(--muted);background:var(--deep);padding:10px 12px;border:2px solid var(--line)}
.blink{color:var(--yellow);animation:bl 1.6s steps(2,jump-none) infinite}
@keyframes bl{50%{opacity:.3}}
.say{background:var(--panel);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.say p{font-family:var(--alenbi);font-size:18px;line-height:1.4}
.say b{color:var(--yellow)}
.say .stg{color:var(--muted)}
.say .stg b{color:var(--muted);font-weight:500;margin:0}
.stg{display:flex;align-items:center;gap:6px;font-size:14px}
.stg b{margin-inline-start:6px}
.sq{width:14px;height:14px;border:2px solid var(--line);background:var(--deep)}
.sq.on{background:var(--yellow);border-color:var(--yellow)}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.dock .choices{padding-block:0}
.eyebrow{font-family:var(--ui);font-size:13px;font-weight:500;letter-spacing:.04em;color:#8680B0;text-align:center}
.dock .row{display:flex;gap:8px}
.dock .row .btn{flex:1;padding-inline:8px}
.dock .quietrow{justify-content:stretch;gap:0}.dock .quietrow .btn{flex:1 1 0;justify-content:center;text-align:center;padding:0 4px}
.btn.txt{background:transparent;border-color:transparent;box-shadow:none;color:var(--yellow);font-weight:700;font-size:18px;text-decoration:underline;text-underline-offset:4px;min-height:52px}
.btn.txt:active{transform:none}
#s-entry{align-items:center;justify-content:center;text-align:center;gap:18px}
#s-entry h2{font-size:32px;color:var(--yellow)}
.lead2{font-family:var(--alenbi);font-size:22px;line-height:1.4;color:var(--fg);max-width:20em}
#s-entry .acts{width:100%;margin-top:34px}
.field+.lead,.field+.say{margin-top:18px}
input::placeholder{color:var(--muted);opacity:.7}
.err .chip{padding:0;min-height:0;display:inline;border:0;font:inherit;color:var(--yellow);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
[hidden]{display:none!important}
</style>

  {label:'לחפש קיצור דרך בין הסלעים',opens:'מצאת מעבר צר בין שני סלעים, וחסכתם דרך ארוכה. יובל מחא כפיים בשקט, ואתם קדמתם את ענבר בחצי דקה.',fx:{w:1}},
  {label:'לקרוא לענבר שתחכה',opens:'ענבר האטה ועצרה על סלע גבוה. "אתם לא כאלה גרועים," אמרה, וחיכתה שתגיעו.',fx:{h:1,i:1}}]}

s17:{n:17,kw:'מנגנים',img:'w17a_bridge',next:'s18',

 choices:[
 {label:'לעלות על הגשר בלי לפחד מהאורות',opens:'עלית על הגשר והקרשים חרקו מתחת לרגליים. האורות המנגנים חגו סביבך, ולא נגעו בך.',fx:{c:1}},
 {label:'להקשיב להמיה ולהבין מה היא אומרת',opens:'הקשבת היטב, וההמיה נשמעה כמו שיר ערש ישן. נדמה שהאורות מנסים להרגיע מישהו.',fx:{w:1}},
 {label:'לאחוז בזיק ולהרגיע אותו',opens:'חיבקת את זיק, והוא נרגע. האורות המנגנים התקרבו אליו לאט, כאילו הכירו אותו.',fx:{h:1,z:1}}]},

s18:{n:18,kw:'דהה',img:'w18a_lights_zik',next:'s19',
 text:st=>`האורות הזעירים עטפו את זיק בחוג שקט, ובכל סיבוב הם לקחו ממנו פיסה קטנה של זוהר. ${Z(st,'האור של זיק דהה מעט, והוא רעד','זיק עמד בתוך החוג ולא זז')}. יובל הסתכל עליו בפחד, וענבר, שרצתה להמשיך, עצרה פתאום ולא אמרה כלום.`,

 {label:'להרחיק את זיק מהמים ולהבין למה הם באו',opens:'הרחקת את זיק מהנהר, והאורות איבדו עניין. הבנת שהם נמשכים אל האור, כמו חרקים אל פנס.',fx:{w:1}},
 {label:'לחבק את זיק ולהחזיר לו חום',opens:'חיבקת את זיק, והוא התחמם בידיים שלך. הזוהר שלו חזר לאט, אבל נשאר חיוור מעט יותר.',fx:{h:1,z:1,zl:1}}]},

s19:{n:19,kw:'סוד',img:'w19a_riverbank',next:'s20',
 text:st=>`על גדת הנהר ישבה ענבר ופתחה את התרמיל שלה. בפנים היה פנס כחול ריק, בלי אש. ${st.road==='race'?'היא אמרה, בלי להסתכל עליכם, ':'היא אמרה בשקט, '}שהכפר שלה חשוך כבר חודשים, שאין לו פנס אחד שדולק, ושהיא באה ללקט ניצוץ אחד בשבילו. זה הסוד שלה, והיא מבקשת שלא תספרו.`,
 choices:[
 {label:'להבטיח לה שתעזרו',opens:'הבטחת לענבר, והיא הרימה אליך עיניים רטובות. "גם אני לא רגילה להישען על מישהו," לחשה.',fx:{h:1,i:2,f:'promise'}},
 {label:'לשאול מה תעשה עם הניצוץ',opens:'ענבר אמרה שתחזיר אותו לכפר שלה, ושלא איכפת לה מי יצטרך לוותר. הבנת שהיא ישירה, לא רעה.',fx:{w:1,i:1}},
 {label:'להציע לחצות את הנהר ביחד',opens:'הצעת, וענבר קמה מיד. "אז בואו נחצה," אמרה, והצד הרגוע שלה כבר חזר.',fx:{c:1,i:1}}]},

s20:{n:20,kw:'מפה',img:'w20a_maps',next:'s21',

s21:{n:21,kw:'פער',img:'w21a_bridge_mid',next:'s22',
 text:st=>`באמצע הגשר היה פער של שלושה קרשים חסרים, והנהר הכסוף זרם מתחתיו ברוחב עצום. הרוח הניעה את החבלים, והגשר התנדנד לאט משמאל לימין. ענבר הציצה למטה ואחר כך אליך, ויובל נאחז בחבל עם שתי הידיים.`,

  {label:'לספר על פעם שפתרת בעיה בעורמה',opens:'סיפרת איך מצאת פתרון שאף אחד לא חשב עליו. הניצוץ נדלק בצבע חדש, והשומר צחק בקול.',fx:{w:1,item:'ניצוץ זעיר'}},
  {label:'לספר על פעם שעזרת למישהו',opens:'סיפרת על חבר עצוב, ועל מה שעשית. הניצוץ התחמם, והשומר הגיש לך אותו בשתי ידיים.',fx:{h:1,item:'ניצוץ זעיר'}}]}

s24:{n:24,kw:'שער',img:'w24_stone_gate',next:'s25',
 text:st=>`מאחורי השומר עמד שער אבן ענק, חצי שקוע בנהר, חצי עטוף בקיסוס. מעל הקשת היה חרוט משהו בשפה ישנה, ומבעד לחריצים נראה אור חם, כמו של אולם גדול מאחור. ${st.road==='alone'?'השומר אמר':'ענבר אמרה'} שאם השער יפתח, אין דרך חזרה.`,

 {label:'לבקש מהשער שייפתח, בנימוס',opens:'אמרת בקול רך שאתם צריכים לעבור, ושאתם מבקשים בבקשה. השער חרק, ופתח לפניכם שביל.',fx:{h:1}}]},

 {label:'להגיד שלום לפעמון בקול רך',opens:'אמרת "שלום", והפעמון צלצל צליל חם. הוא ליווה אתכם בשקט עד שפת האגם.',fx:{h:1,zl:1}}]},

function fin(st){
 const F=x=>st.flags.includes(x);
 if(st.road==='with'&&F('promise')&&st.zik&&st.i>=7&&st.h>=7&&F('all'))return 'g';
 if(st.zik&&st.i>=4&&st.h>=6&&(F('all')||F('wise')))return 'a';
 if(st.y>=4&&st.w>=4&&!F('saved'))return 'e';
 if(F('saved')&&st.y>=4&&st.h>=5)return 'b';
 if(F('clever')&&st.w>=6)return 'c';
 if(F('brave')&&st.c>=6)return 'd';
 if(!st.zik)return 'f';
 return 'h';
}

function img(name,cls){return `<img class="pix ${cls||''}" data-n="${name}" src="${IMG[name]}" alt="${esc(ALT[name]||'איור')}">`}
function fmt(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)} · ${p(d.getHours())}:${p(d.getMinutes())}`}
function nodeX(id,st){const n=NODES[id];return n.v?n.v[n.vary(st)||0]:n}
function txt(x,st){return typeof x.text==='function'?x.text(st):x.text}
function kwText(x,T){const t=esc(T),k=x.kw||x.key;return k&&t.includes(esc(k))?t.replace(esc(k),`<span class="kw">${esc(k)}</span>`):t}
function newState(){return {c:1,w:1,h:1,z:0,zl:2,i:0,y:0,joined:false,road:'',flags:[],items:['חצי מפה'],picks:{},ending:null,opens:'',step:0,visited:[],cur:'s0'}}
function replay(hist){
 const st=newState();let id='s0';
 for(let k=0;k<hist.length;k++){
  const node=NODES[id],x=nodeX(id,st),ch=x.choices[hist[k]];
  st.visited.push({k,id,n:node.n,kw:x.kw||x.key,text:txt(x,st),label:ch.label,opens:ch.opens});
  const f=ch.fx||{};st.c+=f.c||0;st.w+=f.w||0;st.h+=f.h||0;st.z+=f.z||0;st.i+=f.i||0;st.y+=f.y||0;st.zl=Math.max(0,Math.min(3,st.zl+(f.zl||0)));
  if(f.join)st.joined=true;if(f.road)st.road=f.road;if(f.f)st.flags.push(f.f);
  if(f.item&&!st.items.includes(f.item))st.items.push(f.item);
  st.picks[id]=hist[k];st.opens=ch.opens;st.zik=st.joined||st.z>=2;
  const e=typeof ch.end==='function'?ch.end(st):ch.end;
  if(e){st.ending=e;break}
  id=ch.next||node.next;st.cur=id;
  const g=NODES[id].gate&&NODES[id].gate(st);
  if(g){st.ending=g;break}
 }
 st.step=hist.length;st.zik=st.joined||st.z>=2;st.n=NODES[st.cur].n;return st;
}

/* ---- soft twinkle: half of the glowing dots in every illustration ---- */
const SPK={};
function sparkProc(name){
 return new Promise(res=>{
  const im=new Image();im.onload=()=>{try{
   const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
   const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,W,H),p=d.data;
   const br=i=>p[i+3]>0&&((p[i+1]>=150&&p[i+2]>=115&&p[i]<150)||(p[i]>=200&&p[i+1]>=200&&p[i+2]>=200));
   const lab=new Int32Array(W*H).fill(-1),comps=[];
   for(let y0=0;y0<H;y0++)for(let x0=0;x0<W;x0++){const k=y0*W+x0;if(lab[k]>=0||!br(k*4))continue;
    const st=[k],px=[];lab[k]=comps.length;
    while(st.length){const q=st.pop();px.push(q);const qx=q%W,qy=(q/W)|0;
     for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=qx+dx,ny=qy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(lab[n]<0&&br(n*4)){lab[n]=comps.length;st.push(n)}}}
    comps.push(px)}
   const small=comps.filter(c=>c.length<=24);
   const chosen=small.filter((c,i)=>i%2===0);
   const groups=[0,1,2].map(()=>{const o=document.createElement('canvas');o.width=W;o.height=H;const ox=o.getContext('2d'),od=ox.createImageData(W,H);return{o,ox,od}});
   const base=new Uint8ClampedArray(p);
   chosen.forEach((c,ci)=>{const g=groups[ci%3];
    c.forEach(k=>{const i=k*4;g.od.data[i]=p[i];g.od.data[i+1]=p[i+1];g.od.data[i+2]=p[i+2];g.od.data[i+3]=255;
     let f=null;for(let r=1;r<=4&&!f;r++){for(let dy=-r;dy<=r&&!f;dy++)for(let dx=-r;dx<=r;dx++){const nx=(k%W)+dx,ny=((k/W)|0)+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(!br(n*4)){f=n*4;break}}}
     if(f){base[i]=p[f];base[i+1]=p[f+1];base[i+2]=p[f+2]}})});
   d.data.set(base);x.putImageData(d,0,0);
   res({base:c.toDataURL(),ov:groups.map(g=>{g.ox.putImageData(g.od,0,0);return g.o.toDataURL()})})
  }catch(e){res(null)}};im.onerror=()=>res(null);im.src=IMG[name]})
}
function sparkle(){
 document.querySelectorAll('img.pix[data-n]:not([data-sp])').forEach(el=>{
  const n=el.dataset.n;el.dataset.sp='1';
  (SPK[n]||(SPK[n]=sparkProc(n))).then(r=>{
   if(!r||!el.isConnected)return;
   el.src=r.base;const cs=getComputedStyle(el);
   r.ov.forEach((u,i)=>{const o=document.createElement('img');o.className='pix ov g'+(i+1);o.src=u;o.alt='';o.setAttribute('aria-hidden','true');
    o.style.objectFit=cs.objectFit;o.style.objectPosition=cs.objectPosition;el.after(o)})})})
}

const DCOL={'#':'#3D3478','y':'#8C7424','Y':'#CDA832','m':'#5EE0C0'};
function decoSvg(rows){let r='';rows.forEach((row,y)=>{[...row].forEach((c,x)=>{if(c!=='.')r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${DCOL[c]}"/>`})});return `<svg class="deco" viewBox="0 0 9 24" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const DECO_L=decoSvg(["...yyy...", "..y...y..", "..y...y..", ".yyyyyyy.", ".y.....y.", ".y..Y..y.", ".y.YYY.y.", ".y.YYY.y.", ".y..Y..y.", "..y...y..", ".yyyyyyy.", "....#....", "....#....", "....#....", "....#....", "....#....", "....#....", "....#....", "....#....", "....#....", "....#....", "....#....", "...###...", "..#####.."]),DECO_R=decoSvg([".........", ".........", "......m..", ".........", ".........", "..m......", ".........", ".........", ".......m.", "....#....", ".m.###...", "..#####..", "...###...", "..#####.m", ".#######.", "..#####..", ".#######.", "#########", "....#....", "....#....", "....#....", "....#....", "...###...", "..#####.."]);
function lock(host,onDone){
 const P=[40,120,200];host.innerHTML=DECO_L+`<svg class="lock" viewBox="0 0 240 240" role="img" aria-label="לוח דפוס של תשע נקודות">${[...Array(9)].map((_,i)=>`<circle class="dot" cx="${P[i%3]}" cy="${P[Math.floor(i/3)]}" r="15"/><text x="${P[i%3]}" y="${P[Math.floor(i/3)]+34}" text-anchor="middle">${i+1}</text>`).join('')}<polyline points=""/></svg>`+DECO_R;
 const svg=$('svg.lock',host),poly=$('polyline',svg),dots=svg.querySelectorAll('.dot');let seq=[],drawing=false,pt=null;
 svg.addEventListener('pointerdown',()=>{const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'&&ae.type==='text')ae.blur()});
 const xy=i=>[P[(i-1)%3],P[Math.floor((i-1)/3)]];
 function loc(e){const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*240/r.width,(e.clientY-r.top)*240/r.height]}
 function draw(){const pts=seq.map(i=>xy(i).join(','));if(drawing&&pt&&seq.length)pts.push(pt.join(','));poly.setAttribute('points',pts.join(' '));dots.forEach((d,k)=>d.classList.toggle('on',seq.includes(k+1)))}
 function hit(p){for(let i=1;i<=9;i++){const [x,y]=xy(i);if(Math.hypot(p[0]-x,p[1]-y)<30)return i}return 0}
 svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);seq=[];drawing=true;pt=loc(e);const h=hit(pt);if(h)seq.push(h);draw();e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(!drawing)return;pt=loc(e);const h=hit(pt);if(h&&!seq.includes(h))seq.push(h);draw()});
 const end=()=>{if(!drawing)return;drawing=false;pt=null;draw();const s=seq.slice();setTimeout(()=>{seq=[];draw()},500);onDone(s)};
 svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function backBtn(){return `<button class="chip" id="back">${ico('back',16)}<span>חזרה</span></button>`}
function lantern(sz){
 const R=['...###...','..#...#..','..#...#..','.#######.','.#.....#.','.#..F..#.','.#.FFF.#.','.#.FFF.#.','.#..F..#.','..#...#..','.#######.','..#####..'];
 let r='';R.forEach((row,y)=>{[...row].forEach((c,x)=>{if(c!=='.')r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c==='F'?'#F4EFE0':'#CDA832'}"/>`})});
 return `<svg viewBox="0 0 9 12" width="${sz}" height="${Math.round(sz*12/9)}" shape-rendering="crispEdges" style="filter:drop-shadow(0 0 14px rgba(205,168,50,.55))" aria-hidden="true">${r}</svg>`;
}

function signup(){
 let first=null;
 show(`<section class="screen"><div class="top"><h2>משתמש חדש</h2>${backBtn()}</div><div class="scroll fade">
 <div class="field"><label for="nick">חברים שלי קוראים לי… (2 עד 12 תווים)</label><input type="text" id="nick" maxlength="12" autocomplete="off" placeholder="למשל: כוכבית, נץ או ברק"><span class="muted small">אל תכתבו שם אמיתי. בחרו כינוי שלא מזהה אתכם.</span></div>

 </div></section>`,()=>{
  $('#back').onclick=entry;
  const say=$('#say'),err=$('#err');
  function stage(n,msg){
   say.innerHTML=`<div class="stg"><b>שלב ${n} מתוך 2</b></div>`+
   (n===1?`<p>ציירו דפוס: חברו לפחות <b>4 נקודות</b> בקו אחד, בלי להרים את האצבע.</p>`
        :`<p>הדפוס נקלט. <b>ציירו אותו שוב, בדיוק אותו דבר</b>, כדי לוודא שאתם זוכרים אותו.</p>`);
   $('#redo').hidden=n===1;
   if(msg!==undefined)err.textContent=msg;
  }
  $('#redo').onclick=()=>{first=null;stage(1,'')};
  stage(1,'');
  lock($('#lk'),seq=>{
   const n=$('#nick').value.trim();err.textContent='';
   if(n.length<2){err.textContent='קודם כתבו כינוי של 2 תווים לפחות, ואז ציירו את הדפוס.';first=null;stage(1);return}
   if(!/^[֐-׿a-zA-Z0-9 _-]+$/.test(n)){err.textContent='בכינוי אפשר רק אותיות, ספרות ורווח.';return}

   if(us[n]){let k=2;while(us[n+k])k++;err.innerHTML=`הכינוי הזה תפוס. אפשר <button class="chip" id="sug">${esc(n+k)}</button>`;$('#sug').onclick=()=>{$('#nick').value=n+k;err.textContent=''};first=null;stage(1);return}
   if(seq.length<4){err.textContent='הדפוס קצר מדי. חברו לפחות 4 נקודות בקו אחד.';return}
   if(!first){first=seq.join('');stage(2,'');return}
   if(first!==seq.join('')){err.textContent='זה לא אותו דפוס כמו בפעם הראשונה. נסו שוב לצייר את אותו דפוס, או התחילו דפוס חדש.';return}
   us[n]={pat:first,saves:[],endings:[]};saveUsers(us);S.user=n;remember(n);menu();
  });
 });
}

function play(){

 ${st.opens?`<p class="opens">${esc(st.opens)}</p>`:''}
 <p class="story">${kwText(step,T)}</p>
 </div><div class="dock"><div class="choices" role="group" aria-label="מה עושים?">${step.choices.map((c,i)=>`<button class="btn ${step.choices.length===1?'yellow center':''}" data-i="${i}">${step.choices.length===1?'':'<span class="mk"></span>'}<span style="flex:1">${esc(c.label)}</span></button>`).join('')}</div>
 ${st.step>0?`<div><button class="btn quiet" id="undo">${ico('back',16)}<span>צעד אחורה</span></button></div>`:''}</div></section>`,()=>{
  wireHeader();
  const u=$('#undo');if(u)u.onclick=undoLast;
  app.querySelectorAll('.choices .btn').forEach(b=>b.onclick=()=>{mutate(m=>{const s=m.saves.find(x=>x.id===S.save);s.hist.push(+b.dataset.i);s.upd=Date.now()});play()});
 });
}
function endCard(id,st){
 const e=ENDINGS.find(x=>x.id===id);
 mutate(m=>{if(!m.endings.includes(id))m.endings.push(id)});
 show(`<section class="screen"><div class="scroll fade"><div class="imgwrap tall sm">${img(e.img)}</div><div class="muted small">סוף</div><h2>${esc(e.name)}</h2><p class="story">${esc(e.text)}</p>
 <div class="muted small">${esc(e.hint||'')}</div></div><div class="dock">
 <button class="btn yellow center" id="retry">לנסות דרך אחרת</button>
 <div class="row quietrow"><button class="btn quiet" id="sum"><span>סיכום המסע</span></button><button class="btn quiet" id="col"><span>אוסף הסופים</span></button><button class="btn quiet" id="m"><span>לתפריט</span></button></div></div></section>`,()=>{
  $('#retry').onclick=undoLast;$('#sum').onclick=()=>journey('map');$('#col').onclick=()=>endings('end');$('#m').onclick=menu;
 });
}
function journey(tab){
 const sv=curSave();const st=replay(sv.hist);const h=sv.hist;
 const map=st.visited.map((v,idx)=>{const last=idx===st.visited.length-1&&!st.ending;
  return `<div class="node ${last?'now':''}"><div class="k">${v.k===0?'פתיחה':'שלב '+v.n} · ${esc(v.kw)}</div><div class="c">${v.k===0?'התחלת המסע':'בחרתם: '+esc(v.label)}</div>${v.k>0?`<button class="btn quiet go" data-i="${v.k}">חזרה לנקודה הזו</button>`:''}</div>`}).join('');
 const story=st.visited.map((v,idx)=>{const prev=idx>0?st.visited[idx-1].opens:'';
  return `${prev?`<p>${esc(prev)}</p>`:''}<p>${esc(v.text)}</p>${v.k>0?`<p class="pick">${esc(v.label)}</p>`:''}`}).join('')+(st.opens?`<p>${esc(st.opens)}</p>`:'');
 show(`<section class="screen"><div class="top"><h2>סיכום המסע</h2>${backBtn()}</div>
 <div class="tabs" role="tablist"><button class="tab" role="tab" id="t1" aria-selected="${tab==='map'}">מפת ההחלטות</button><button class="tab" role="tab" id="t2" aria-selected="${tab!=='map'}">הסיפור שלי</button></div>
 <div class="scroll fade">${score(st)}<div id="p1" ${tab==='map'?'':'hidden'}><div class="map">${map}</div><p class="muted small" style="margin-top:8px">חזרה לנקודה מוחקת את כל מה שקרה אחריה.</p></div><div id="p2" class="fullstory" ${tab==='map'?'hidden':''}>${story}</div></div></section>`,()=>{
  $('#back').onclick=play;
  const sw=a=>{$('#t1').setAttribute('aria-selected',a);$('#t2').setAttribute('aria-selected',!a);$('#p1').hidden=!a;$('#p2').hidden=a};
  $('#t1').onclick=()=>sw(true);$('#t2').onclick=()=>sw(false);
  app.querySelectorAll('.go').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;mutate(m=>{const s=m.saves.find(x=>x.id===S.save);s.hist=s.hist.slice(0,i);s.upd=Date.now()});play()});
 });
}
function endings(from){
 const me=users()[S.user];
 show(`<section class="screen"><div class="top"><h2>אוסף הסופים</h2>${backBtn()}</div><p class="lead">מצאתם ${me.endings.length} מתוך ${ENDINGS.length}. לכל סוף יש דרך משלו.</p>
 <div class="scroll fade"><div class="grid">${ENDINGS.map(e=>{const f=me.endings.includes(e.id);return `<div class="end ${f?'found':''}"><div class="t">${f&&e.img?img(e.img):'?'}</div><span>${f?esc(e.name):'סוף נסתר'}</span></div>`}).join('')}</div></div></section>`,()=>{
  $('#back').onclick=()=>{from==='end'?play():menu()};
 });
}
openScreen();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
